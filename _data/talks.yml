#
#  To add a talk: copy a block and put it at the TOP of the list.
#  To attach slides: drop the PDF in files/ and add a `slides:` line.
#
#  Fields
#  ──────
#  date      required. Display string, e.g. "May 2026", "Nov–Dec 2023", "2021–2023".
#  title     required. Talk title, or the meeting name.
#  venue     optional. Institution and/or city.
#  invited   optional. true adds an "Invited" tag.
#  note      optional. One extra line, e.g. "Awarded travel support".
#  slides    optional. Path to a PDF, e.g. /files/asu-mma-2026.pdf
#  poster    optional. Path to a poster PDF.
#  video     optional. URL to a recording.
#
# ══════════════════════════════════════════════════════════════

