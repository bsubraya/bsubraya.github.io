# ─────────────────────────────────────────────────────────────
#  Site settings
#  Bhagya M. Subrayan — bsubraya.github.io
#  Custom theme, built on plain Jekyll (GitHub Pages compatible)
# ─────────────────────────────────────────────────────────────

title            : "Bhagya M. Subrayan"
tagline          : "Postdoctoral Research Associate, Steward Observatory, University of Arizona"
description      : "Bhagya M. Subrayan is a time-domain astronomer at Steward Observatory, University of Arizona, studying young supernovae, dust formation in core-collapse supernova ejecta with JWST, and electromagnetic counterparts to gravitational-wave events."
url              : "https://bsubraya.github.io"
baseurl          : ""
repository       : "bsubraya/bsubraya.github.io"
locale           : "en-US"
timezone         : America/Phoenix

# ── Author / profile ────────────────────────────────────────
author:
  name           : "Bhagya M. Subrayan"
  pronouns       : "she/her/hers"
  role           : "Postdoctoral Research Associate"
  affiliation    : "Steward Observatory, University of Arizona"
  location       : "Tucson, Arizona"
  avatar         : "/images/bhagya_bio.jpg"
  email          : "bsubrayan@arizona.edu"
  address_lines:
    - "Steward Observatory"
    - "University of Arizona"
    - "933 North Cherry Avenue"
    - "Tucson, AZ 85719"

# ── CV: update this one line when you post a new CV ─────────
cv_url           : "/files/BSubrayan_CV_2026_Schmidt_PDFellowship.pdf"

# ── Profile links (rendered as icon buttons) ────────────────
profiles:
  ads            : "https://ui.adsabs.harvard.edu/public-libraries/wpvAYw7RR92BEdDvDelBxw"
  scholar        : "https://scholar.google.com/citations?hl=en&user=t4L_D18AAAAJ"
  orcid          : "https://orcid.org/0000-0001-8073-8731"
  github         : "https://github.com/bsubraya"
  linkedin       : "https://www.linkedin.com/in/bhagyasubrayan"

og_image         : "/images/bhagya_bio.jpg"

# ── Analytics ───────────────────────────────────────────────
google_analytics : "G-9Z2D3JBRR0"

# ── Build ───────────────────────────────────────────────────
markdown         : kramdown
highlighter      : rouge
kramdown:
  input          : GFM
  hard_wrap      : false
  auto_ids       : true
  smart_quotes   : lsquo,rsquo,ldquo,rdquo

sass:
  sass_dir       : _sass
  style          : compressed

include:
  - _pages
  - files

exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - vendor
  - .bundle
  - node_modules
  - tools

defaults:
  - scope:
      path       : ""
      type       : pages
    values:
      layout     : page

plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from

whitelist:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from
